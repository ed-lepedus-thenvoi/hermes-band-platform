name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (Hermes ${{ matrix.hermes_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hermes_label: "0.19"
            hermes_spec: "hermes-agent==0.19.0"
          - hermes_label: "current"
            hermes_spec: "hermes-agent>=0,<1"
    env:
      # The gateway probes these provider keys; keep them empty so nothing
      # tries to reach a live LLM during tests.
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install host + plugin
        run: |
          # hermes-agent is the HOST (provides gateway/, tools/, ...); band-sdk
          # is the runtime dep. Then install this plugin + dev extras.
          # uv drives the e2e directory-install test (and install.sh itself).
          pip install '${{ matrix.hermes_spec }}' 'band-sdk>=1.3.0,<2.0.0' uv
          pip install -e ".[dev]"

      - name: Standalone-load guard
        run: python scripts/standalone_import_check.py

      - name: Root manifest sync guard
        # The root plugin.yaml is generated from the packaged manifest (single
        # source of truth). Fail if it drifted — regenerate with
        # `python scripts/sync_root_manifest.py --write`.
        run: python scripts/sync_root_manifest.py --check

      - name: Lint
        run: ruff check hermes_band_platform tests scripts __init__.py

      - name: Tests
        run: python -m pytest tests -q

      - name: E2E — directory install on a read-only gateway venv
        # Simulates the hosted-runtime shape (/opt/hermes/.venv unwritable):
        # installer → enable → gateway load → import band → chat -s band:add-band,
        # all via user-writable $HERMES_HOME paths.
        env:
          HERMES_E2E: "1"
        run: python -m pytest tests/test_e2e_directory_install.py -q

  sdk-floor-contract:
    name: band-sdk 1.3.0 floor contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install exact minimum SDK
        run: pip install 'band-sdk==1.3.0'

      - name: Probe real error-event contract (no pytest stubs)
        run: python scripts/error_event_contract_probe.py

      - name: Probe real usage contract (no pytest stubs)
        run: python scripts/probe_band_sdk_usage_contract.py

      - name: Probe real mention-kind contract (no pytest stubs)
        run: python scripts/probe_band_sdk_mention_kind_contract.py
