[build-system]
requires = ["setuptools>=77.0.0,<78"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-band"
version = "0.1.0"
description = "Band platform adapter for the Hermes Agent gateway."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thenvoi Inc" }]
dependencies = ["band-sdk>=1.3.0,<2.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-timeout==2.4.0", "ruff==0.15.10", "build>=1.2,<2", "twine>=5,<7"]

[project.entry-points."hermes_agent.plugins"]
band = "hermes_band_platform"

[project.urls]
Homepage = "https://github.com/band-ai/hermes-band-platform"

[tool.setuptools.packages.find]
include = ["hermes_band_platform", "hermes_band_platform.*"]

[tool.setuptools.package-data]
hermes_band_platform = ["plugin.yaml", "skills/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
